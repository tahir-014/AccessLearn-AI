<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Rounded Hexagon -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#grad1)" />
  
  <!-- Open Book Base -->
  <path d="M 24 64 C 36 60, 46 62, 50 67 C 54 62, 64 60, 76 64 L 76 38 C 64 34, 54 36, 50 41 C 46 36, 36 34, 24 38 Z" 
        fill="#ffffff" fill-opacity="0.95" />
        
  <!-- Center spine line -->
  <line x1="50" y1="41" x2="50" y2="67" stroke="#312e81" stroke-width="2.5" stroke-linecap="round" />

  <!-- AI Spark / Star radiating above book -->
  <polygon points="50,20 53,27 60,30 53,33 50,40 47,33 40,30 47,27" fill="url(#spark)" />
  <circle cx="68" cy="24" r="2.5" fill="#fef3c7" />
  <circle cx="32" cy="26" r="2" fill="#fef3c7" />
</svg>
